- name: Set up JDK 17
  uses: actions/setup-java@v3
  with:
    java-version: '17'
    distribution: 'temurin'

- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v3
  with:
    gradle-version: '8.2'  # ✅ Фиксируем версию!

- name: Build Debug APK
  run: cd android && gradle assembleDebug
